<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12141A"/>
      <stop offset="1" stop-color="#1B1F2A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="orange" x1="164" y1="100" x2="252" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4A261"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <linearGradient id="blue" x1="340" y1="132" x2="278" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9AB6FF"/>
      <stop offset="1" stop-color="#6C83F8"/>
    </linearGradient>
    <linearGradient id="violet" x1="348" y1="376" x2="236" y2="302" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C58AF9"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="gray" x1="160" y1="388" x2="238" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DADDE5"/>
      <stop offset="1" stop-color="#8A93A8"/>
    </linearGradient>
  </defs>

  <rect x="40" y="40" width="432" height="432" rx="112" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Outer orbit ring -->
    <circle cx="256" cy="256" r="136" stroke="#2A3142" stroke-width="18"/>

    <!-- Four interwoven ribbon-loops -->
    <path d="M256 124c-36 0-72 20-90 56-16 32-14 70 6 102 18 28 47 48 84 64"
          stroke="url(#orange)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M388 256c0-36-20-72-56-90-32-16-70-14-102 6-28 18-48 47-64 84"
          stroke="url(#blue)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 388c36 0 72-20 90-56 16-32 14-70-6-102-18-28-47-48-84-64"
          stroke="url(#violet)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M124 256c0 36 20 72 56 90 32 16 70 14 102-6 28-18 48-47 64-84"
          stroke="url(#gray)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central hub / connection point -->
    <circle cx="256" cy="256" r="56" fill="#171B24" stroke="#3A4258" stroke-width="12"/>
    <path d="M228 256h56M256 228v56" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.96"/>
    <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>
  </g>
</svg>
